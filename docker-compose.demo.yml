services:
  fortune-liuyao-mcp:
    build: .
    environment:
      PORT: "8000"
      FORTUNE_LIUYAO_OUTPUT_DIR: /app/outputs
      FORTUNE_LIUYAO_PUBLIC_BASE_URL: http://localhost:8088
    ports:
      - "8000:8000"
    volumes:
      - fortune_liuyao_outputs:/app/outputs
  fortune-liuyao-files:
    image: nginx:1.27-alpine
    ports:
      - "8088:80"
    volumes:
      - fortune_liuyao_outputs:/usr/share/nginx/html:ro

volumes:
  fortune_liuyao_outputs:
