name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python skill/fortune-liuyao/scripts/run_liuyao.py --selfcheck
      - run: python scripts/package_skill.py
      - run: python scripts/package_skill.py --validate-only
      - uses: actions/upload-artifact@v4
        with:
          name: fortune-liuyao-skill-py${{ matrix.python-version }}
          path: dist/fortune-liuyao-skill.zip
